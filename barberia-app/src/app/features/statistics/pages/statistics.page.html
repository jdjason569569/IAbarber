<ion-header>
  <ion-toolbar>
    <ion-title>{{ 'statistics.title' | t }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (stats(); as stats) {
    <ion-grid>
      <ion-row>
        @for (total of stats.totals; track total.key) {
          <ion-col size="6">
            <ion-card class="total-card">
              <ion-card-header>
                <ion-card-title>{{ total.value }}</ion-card-title>
                <ion-card-subtitle>{{ totalLabel(total.key) }}</ion-card-subtitle>
              </ion-card-header>
            </ion-card>
          </ion-col>
        }
      </ion-row>
    </ion-grid>
  } @else {
    <p class="ion-padding ion-text-center">
      @if (loading()) { {{ 'statistics.loading' | t }} } @else { {{ error() }} }
    </p>
  }
</ion-content>
