<ion-header>
  <ion-toolbar>
    <ion-title>{{ 'settings.title' | t }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="signOut()" [attr.aria-label]="'auth.signOut' | t">
        <ion-icon slot="start" name="log-out-outline"></ion-icon>
        {{ 'auth.signOut' | t }}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Each section is a graphite card. Only the link card tilts: the other two hold form fields and
       the availability popup, which a transformed parent would displace. The barber's name goes first. -->
  <app-barber-name-editor class="settings-card card-3d stagger-item" style="--i: 0" />
  <app-booking-link-card class="settings-card card-3d stagger-item" appTilt3d="5" style="--i: 1" />
  <app-service-price-editor class="settings-card card-3d stagger-item" style="--i: 2" />
  <app-day-blocks-editor class="settings-card card-3d stagger-item" style="--i: 3" />
</ion-content>
