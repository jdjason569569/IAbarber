<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="appointments">
      <ion-icon name="calendar-outline"></ion-icon>
      <ion-label>{{ 'tabs.appointments' | t }}</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="statistics">
      <ion-icon name="stats-chart-outline"></ion-icon>
      <ion-label>{{ 'tabs.statistics' | t }}</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="haircut-advisor">
      <ion-icon name="cut-outline"></ion-icon>
      <ion-label>{{ 'tabs.haircutAdvisor' | t }}</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="settings">
      <ion-icon name="settings-outline"></ion-icon>
      <ion-label>{{ 'tabs.settings' | t }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
  <div slot="bottom" class="app-version">{{ 'app.version' | t: { version } }}</div>
</ion-tabs>
